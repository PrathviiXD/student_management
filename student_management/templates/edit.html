{% extends "base.html" %}
{% block title %}Edit Student - Student MS{% endblock %}

{% block content %}
<h1 class="page-title">Edit Student</h1>

<form class="student-form" method="POST" action="{{ url_for('edit_student', student_id=student.id) }}">
    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{ student.name }}" required>
    </div>

    <div class="form-group">
        <label for="roll_no">Roll Number</label>
        <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no }}" required>
    </div>

    <div class="form-group">
        <label for="branch">Branch</label>
        <select id="branch" name="branch" required>
            {% for b in ["Computer Science", "Electronics", "Mechanical", "Civil", "Electrical"] %}
            <option value="{{ b }}" {% if student.branch == b %}selected{% endif %}>{{ b }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="semester">Semester</label>
        <input type="number" id="semester" name="semester" min="1" max="8" value="{{ student.semester }}" required>
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ student.email }}">
    </div>

    <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" value="{{ student.phone }}">
    </div>

    <div class="form-group">
        <label for="marks">Marks (%)</label>
        <input type="number" id="marks" name="marks" min="0" max="100" step="0.1" value="{{ student.marks }}" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Student</button>
        <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
    </div>
</form>
{% endblock %}
