{% extends "base.html" %}
{% block title %}Add Student - Student MS{% endblock %}

{% block content %}
<h1 class="page-title">Add New Student</h1>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form class="student-form" method="POST" action="{{ url_for('add_student') }}" id="studentForm">
    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="roll_no">Roll Number</label>
        <input type="text" id="roll_no" name="roll_no" required>
    </div>

    <div class="form-group">
        <label for="branch">Branch</label>
        <select id="branch" name="branch" required>
            <option value="">-- Select Branch --</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Electrical">Electrical</option>
        </select>
    </div>

    <div class="form-group">
        <label for="semester">Semester</label>
        <input type="number" id="semester" name="semester" min="1" max="8" required>
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
    </div>

    <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone">
    </div>

    <div class="form-group">
        <label for="marks">Marks (%)</label>
        <input type="number" id="marks" name="marks" min="0" max="100" step="0.1" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Student</button>
        <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
    // simple client-side validation feedback
    document.getElementById("studentForm").addEventListener("submit", function (e) {
        const marks = parseFloat(document.getElementById("marks").value);
        if (marks < 0 || marks > 100) {
            e.preventDefault();
            alert("Marks must be between 0 and 100.");
        }
    });
</script>
{% endblock %}
